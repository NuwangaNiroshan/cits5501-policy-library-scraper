# CI gate (report Q12/Q13/Q15): every push to main and every pull request
# runs lint, type check and the test suite. Merges are blocked on failure.
# ubuntu-latest matches the marking environment (Ubuntu, python3 + uv).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (frozen, from uv.lock)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Tests (pytest)
        run: uv run pytest
